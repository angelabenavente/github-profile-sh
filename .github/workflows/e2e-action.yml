# Internal development workflow. Not the installer generated by `github-profile-sh init`.
name: E2E Action Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Action bundle
        run: pnpm build:action

      - name: Generate profile
        uses: ./
        with:
          config: examples/e2e-profile.yml
          output: tmp/e2e/github-profile.svg
          token: ${{ github.token }}

      - name: Generate profiles from manifest
        uses: ./
        with:
          manifest: examples/e2e-outputs.yml
          token: ${{ github.token }}

      - name: Validate generated SVG
        run: |
          set -euo pipefail
          validate() {
            file="$1"
            test -e "$file"
            test -s "$file"
            grep -q '<svg' "$file"
            grep -q 'github-profile.sh' "$file"
            grep -q 'fetching public profile data' "$file"
            if grep -qiE '<script|javascript:' "$file"; then
              echo "SVG must not contain JavaScript"
              exit 1
            fi
          }
          validate tmp/e2e/github-profile.svg
          validate tmp/e2e/main.svg
          validate tmp/e2e/languages.svg

      - name: Upload generated SVGs
        uses: actions/upload-artifact@v7
        with:
          name: github-profile-sh-e2e
          path: tmp/e2e/
          if-no-files-found: error
