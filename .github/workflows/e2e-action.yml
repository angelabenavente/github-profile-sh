# Internal development workflow. Not the installer generated by `github-profile-sh init`.
name: E2E Action Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Action bundle
        run: pnpm --filter @github-profile-sh/action build

      - name: Generate profile
        uses: ./
        with:
          config: examples/e2e-profile.yml
          output: tmp/e2e/github-profile.svg
          token: ${{ github.token }}

      - name: Validate generated SVG
        run: |
          set -euo pipefail
          file="tmp/e2e/github-profile.svg"
          test -e "$file"
          test -s "$file"
          grep -q '<svg' "$file"
          grep -q 'github-profile.sh' "$file"
          grep -q 'fetching public profile data' "$file"
          if grep -qiE '<script|javascript:' "$file"; then
            echo "SVG must not contain JavaScript"
            exit 1
          fi

      - name: Upload generated SVG
        uses: actions/upload-artifact@v7
        with:
          name: github-profile-sh-e2e
          path: tmp/e2e/github-profile.svg
          if-no-files-found: error
