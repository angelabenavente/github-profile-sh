name: github-profile.sh
description: Animated GitHub profile stats rendered as a terminal.
inputs:
  config:
    description: Path to the github-profile.sh configuration file
    required: false
    default: github-profile-sh.yml
  output:
    description: Path to write the generated SVG
    required: false
    default: github-profile.svg
  token:
    description: GitHub token used to fetch public profile data
    required: true
  manifest:
    description: Optional path to a multi-profile outputs manifest. When set, config and output are ignored.
    required: false
outputs:
  svg-path:
    description: Path of the generated SVG in single-output mode
  svg-paths:
    description: JSON array of generated SVG paths
runs:
  using: node24
  main: dist/index.js
